name: Update GitHub Metrics

on:
  workflow_dispatch: # 手动触发
  push: { branches: [ "trunk" ] }
  schedule: [ {cron: '30 20 1 * *' } ] # 每月一号晚八点半

jobs:
  update-github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with: # https://github.com/lowlighter/metrics
          user: charlie-wong
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          committer_message: "docs: update statistics metrics"
          template: classic
          config_output: svg
          config_display: large
          base: header, activity, community, repositories, metadata
          repositories_forks: yes
          users_ignored: action@github.com
          commits_authoring: charlie-wong, charlie-wong@outlook.com
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_categories: markup, programming
          plugin_languages_sections: recently-used, most-used
