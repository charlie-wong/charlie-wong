name: Generate Contributions Graph

on:
  workflow_dispatch: # 手动触发
  push: { branches: [ "trunk" ] }
  # 周期性 => 分钟[0,59]  小时[0,23]  日期[1,31]  月份[1,12]  星期[0,6]
  # https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html
  schedule: # 触发时间 => 周日晚上八点半
    - cron: '30 20 * * 0'

# https://github.com/crazy-max/ghaction-github-pages

jobs:
  GenerateGridSnake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # https://github.com/actions/checkout
      - name: Checkout user-profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/Platane/snk
      - name: Generate github contributions grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/grid-snake-lite.svg
            assets/grid-snake-dark.svg?palette=github-dark

      - name: Commit generated grid snake SVG files
        run: |
          git config --local user.name  "GitHub Robot"
          git config --local user.email "wong@xwlc.tech"
          git add .
          git commit -m "docs: update grid snake animation"

      # https://github.com/ad-m/github-push-action
      - name: Push changes back to repository
        uses: ad-m/github-push-action@master
        with:
          branch: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
