name: Update Contribs Graph

on:
  workflow_dispatch: # 手动触发
  push: { branches: [ "trunk" ] }
  # 周期性 => 分钟[0,59]  小时[0,23]  日期[1,31]  月份[1,12]  星期[0,6]
  # https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html
  schedule: # 触发时间 => 每月一号晚八点半
    - cron: '30 20 1 * *'

jobs:
  update-contribs-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout user-profile repository
        uses: actions/checkout@v4
        with: # https://github.com/actions/checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Generate github contributions grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-lite.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit generated grid snake SVG files
        run: |
          git config --local user.name  "GithubAction"
          git config --local user.email "action@github.com"
          git add .
          git commit -m "docs: update grid snake animation"

      - name: Push changes back to repository
        uses: ad-m/github-push-action@master
        with: # crazy-max/ghaction-github-pages
          branch: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
