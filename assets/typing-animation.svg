<!--
英语字体 Alex Brush 汉字字体 Zhi Mang Xing
https://readme-typing-svg.demolab.com/demo/
https://github.com/DenverCoder1/readme-typing-svg/
-->
<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
  viewBox='0 0 500 50' style='background-color: #00000000;' width='500px' height='50px'>
  <style>
@font-face {
  font-family: 'CharlesWong';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/woff2;base64,
  ) format('woff2');
}
</style>
  <path id='path0'>
    <animate id='d0' attributeName='d' begin='0s;d3.end' dur='6000ms' fill='remove' values='m0,25 h0; m0,25 h500; m0,25 h500; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='CharlesWong' fill='#36BCF7' font-size='25' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path0'>莫道君行早，更有早行人。</textPath>
  </text>

  <path id='path1'>
    <animate id='d1' attributeName='d' begin='d0.end' dur='6000ms' fill='remove' values='m0,25 h0; m0,25 h500; m0,25 h500; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='CharlesWong' fill='#36BCF7' font-size='25' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path1'>Time make it great.</textPath>
  </text>

  <path id='path2'>
    <animate id='d2' attributeName='d' begin='d1.end' dur='6000ms' fill='remove' values='m0,25 h0; m0,25 h500; m0,25 h500; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
    </path>
  <text font-family='CharlesWong' fill='#36BCF7' font-size='25' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path2'>Coding is easy, but do it well hard.</textPath>
  </text>

  <path id='path3'>
    <animate id='d3' attributeName='d' begin='d2.end' dur='6000ms' fill='remove' values='m0,25 h0; m0,25 h500; m0,25 h500; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
    </path>
  <text font-family='CharlesWong' fill='#36BCF7' font-size='25' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path3'>Keep it simple and stupid, do one thing and do it well.</textPath>
  </text>
</svg>
