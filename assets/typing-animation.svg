  <style>
<!-- 英语字体 Alex Brush    汉字字体 Zhi Mang Xing -->
@font-face {
  font-family: 'TypingSVG';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/woff2;base64,
  ) format('woff2');
}
</style>
  <path id='path0'>
    <animate id='d0' attributeName='d' begin='0s;d2.end' dur='6000ms' fill='remove'
      values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"TypingSVG", monospace' fill='#36BCF7' font-size='25' dominant-baseline='middle'
    x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path0'>莫道君行早，更有早行人。</textPath>
  </text>

  <path id='path1'>
    <animate id='d1' attributeName='d' begin='d0.end' dur='6000ms' fill='remove'
      values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"TypingSVG", monospace' fill='#36BCF7' font-size='25' dominant-baseline='middle'
    x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path1'>Time make it great.</textPath>
  </text>

  <path id='path2'>
    <animate id='d2' attributeName='d' begin='d1.end' dur='6000ms' fill='remove'
      values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"TypingSVG", monospace' fill='#36BCF7' font-size='25' dominant-baseline='middle'
