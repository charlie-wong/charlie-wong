<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
  viewBox='0 0 435 50' style='background-color: #00000000;' width='435px' height='50px'>
  <style>
@font-face {
  font-family: 'Alex Brush';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/woff2;base64,) format('woff2');
}
</style>
  <path id='path0'>
    <animate id='d0' attributeName='d' begin='0s;d2.end' dur='6000ms' fill='remove' values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"Alex Brush", monospace' fill='#36BCF7' font-size='20' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path0'>Keep it simple and stupid.</textPath>
  </text>

  <path id='path1'>
    <animate id='d1' attributeName='d' begin='d0.end' dur='6000ms' fill='remove' values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"Alex Brush", monospace' fill='#36BCF7' font-size='20' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path1'>Time will make it great.</textPath>
  </text>

  <path id='path2'>
    <animate id='d2' attributeName='d' begin='d1.end' dur='6000ms' fill='remove' values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
  </path>
  <text font-family='"Alex Brush", monospace' fill='#36BCF7' font-size='20' dominant-baseline='middle' x='50%' text-anchor='middle' letter-spacing='normal'>
    <textPath xlink:href='#path2'>Coding easy do well is hard.</textPath>
  </text>
